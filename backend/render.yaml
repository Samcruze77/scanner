services:
  - type: web
    name: document-converter-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: document-converter-api
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: OUTPUT_DIR
        value: /tmp/outputs
      - key: REDIS_URL
        fromService:
          name: document-converter-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: document-converter-db
          property: connectionString

  - type: worker
    name: document-converter-worker
    runtime: docker
    dockerfilePath: ./Dockerfile.worker
    envVars:
      - key: NODE_ENV
        value: production
      - key: SERVICE_NAME
        value: document-converter-worker
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: OUTPUT_DIR
        value: /tmp/outputs
      - key: REDIS_URL
        fromService:
          name: document-converter-redis
          type: redis
          property: connectionString
      - key: DATABASE_URL
        fromDatabase:
          name: document-converter-db
          property: connectionString

  - type: redis
    name: document-converter-redis
    plan: free

databases:
  - name: document-converter-db
    plan: free
